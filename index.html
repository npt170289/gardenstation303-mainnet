<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <section id="hero-fullvibe" class="max-w- mx-auto p-4">
  <video src="public/videos/fullvibe.mp4" autoplay muted loop playsinline class="w-full aspect-[16/9] object-cover rounded- border border-white/[0.08] bg-[#111]"></video>
</section><div id="root"></div>
  
  <!-- CLIP 5s: chừa chỗ cho clip 5s, grid 4 video, DƯỚI gallery, TRƯỚC menu.
       React render toàn bộ trang BÊN TRONG #root nên section này không thể viết
       cứng vào giữa gallery và menu trong index.html. js/clips.js sẽ dời nó lên
       trước section MENU ("MENU 2 KHU...") ngay khi React render xong.
       Dùng đúng class Tailwind của section video sẵn có trong main.js. -->
  

    <!-- Menu data: load gọn trước bundle React (đồng bộ, để main.js có đủ 308 món khi render) -->
  <script src="data/menu-items.js"></script>
  <script src="js/menu-data.js"></script>
  <script type="module" src="js/main.js"></script>
  <script src="js/clips.js"></script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if(((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host)||u.protocol==="mailto:"||u.protocol==="tel:"||u.protocol==="sms:"){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  <script type="application/json" data-clippy-inline-media-manifest="1">{"version":1,"slots":[]}</script>
</body>
</html>
