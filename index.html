<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Garden Station 303 - MAINNET A2U Batch</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:20px}
h2 span{color:#fff;background:red;padding:5px 10px;border-radius:5px}
button{padding:12px 20px;margin:10px;font-size:16px;cursor:pointer;font-weight:bold}
#log{white-space:pre-wrap;background:#000;padding:15px;border:1px solid #0f0;height:400px;overflow:auto}
</style>
</head>
<body>
<h2>🚀 Garden Station 303 - <span>MAINNET</span> Batch A2U</h2>
<p>Giữ khuôn 5 UID chuẩn - Đổi sang API Key Mainnet mới fkjhvw...</p>
<button id="btnLogin">1. ĐĂNG NHẬP PI MAINNET</button>
<button id="btnPay">2. BẮN 5 UID MAINNET</button>
<div id="log">Sẵn sàng MAINNET...</div>
<script>
const Pi=window.Pi;
Pi.init({version:"2.0", sandbox:false}); // MAINNET - Không phải Testnet nữa

// GIỮ NGUYÊN 5 UID CHUẨN ĐÃ ĐẬU A2U TESTNET
const TARGET_UIDS=[
{username:"nguyenanhtuan113113",uid:"657c1562-9472-4013-a76c-134404310717"},
{username:"thuongsheva",uid:"70ea2ff5-c5ef-4dd2-a934-d8c73e280696"},
{username:"phithuong07",uid:"0f8fdab1-75de-471e-a09f-896652b263d6"},
{username:"thuongsheva01",uid:"13eb4a7e-be36-42cc-9c4a-61dbd7d9359f"},
{username:"dttngan123",uid:"e668ffbf-8de9-42c3-a918-b3ffd13ba9ce"}
];
function addLog(m){let el=document.getElementById('log');el.textContent+="\n["+new Date().toLocaleTimeString()+"] "+m;el.scrollTop=el.scrollHeight}
document.getElementById('btnLogin').onclick=async()=>{try{addLog("🔄 Xác thực Pi MAINNET...");let auth=await Pi.authenticate(['username','payments'],(p)=>{addLog("Incomplete: "+p.identifier)});addLog("✅ LOGIN MAINNET: "+auth.user.uid)}catch(e){addLog("❌ LỖI: "+e.message)}};
document.getElementById('btnPay').onclick=async()=>{addLog("🚀 BẮT ĐẦU BẮN 5 UID MAINNET...");for(let i=0;i<TARGET_UIDS.length;i++){let u=TARGET_UIDS[i];addLog(`⏳ [${i+1}/5] @${u.username}`);try{let r=await fetch('/api/a2u',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:u.uid,username:u.username,amount:1})});let res=await r.json();if(r.ok)addLog(`✅ [${i+1}/5] @${u.username} THÀNH CÔNG! ${JSON.stringify(res)}`);else addLog(`❌ [${i+1}/5] THẤT BẠI: ${JSON.stringify(res)}`)}catch(err){addLog(`❌ Lỗi mạng: ${err.message}`)}await new Promise(r=>setTimeout(r,1500))}addLog("🎉 XONG BATCH MAINNET!")};
</script>
</body>
</html>
