<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Station 303 - Testnet A2U Batch</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    button { padding: 12px 20px; margin: 10px; font-size: 16px; cursor: pointer; }
    #log { white-space: pre-wrap; background: #000; padding: 15px; border: 1px solid #0f0; height: 400px; overflow: auto; }
  </style>
</head>
<body>
  <h2>🚀 Garden Station 303 - Testnet Batch A2U</h2>
  <button id="btnLogin">1. ĐĂNG NHẬP PI</button>
  <button id="btnPay">2. BẮN 5 UID</button>
  <div id="log">Sẵn sàng kết nối...</div>

<script>
  const Pi = window.Pi;
  Pi.init({ version: "2.0", sandbox: true });

  // Danh sách 5 UID chuẩn xác thực tế
  const TARGET_UIDS = [
    { username: "nguyenanhtuan113113", uid: "657c1562-9472-4013-a76c-134404310717" },
    { username: "thuongsheva",         uid: "70ea2ff5-c5ef-4dd2-a934-d8c73e280696" },
    { username: "phithuong07",         uid: "0f8fdab1-75de-471e-a09f-896652b263d6" },
    { username: "thuongsheva01",       uid: "13eb4a7e-be36-42cc-9c4a-61dbd7d9359f" },
    { username: "dttngan123",          uid: "e668ffbf-8de9-42c3-a918-b3ffd13ba9ce" }
  ];

  function addLog(m) {
    const el = document.getElementById('log');
    el.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + m;
    el.scrollTop = el.scrollHeight;
    console.log(m);
  }

  let tokenSession = null;

  document.getElementById('btnLogin').onclick = async () => {
    try {
      addLog("🔄 Đang yêu cầu xác thực Pi Network...");
      const auth = await Pi.authenticate(['username', 'payments'], (incompletePayment) => {
        addLog("⚠️ Phát hiện giao dịch chưa hoàn thành: " + incompletePayment.identifier);
      });
      tokenSession = auth.accessToken;
      addLog("✅ Đăng nhập thành công! User UID: " + auth.user.uid);
    } catch (e) {
      addLog("❌ Lỗi đăng nhập: " + e.message);
    }
  };

  document.getElementById('btnPay').onclick = async () => {
    addLog("🚀 BẮT ĐẦU QUY TRÌNH BẮN A2U CHO 5 UID...");

    for (let i = 0; i < TARGET_UIDS.length; i++) {
      const user = TARGET_UIDS[i];
      addLog(`⏳ [${i + 1}/5] Đang gửi A2U cho @${user.username} (${user.uid.slice(0, 8)}...)`);

      try {
        const response = await fetch('/api/a2u', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: user.uid,
            username: user.username,
            amount: 1
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          addLog(`✅ [${i + 1}/5] @${user.username} THÀNH CÔNG! PaymentID: ${result.paymentId || 'N/A'}`);
        } else {
          addLog(`❌ [${i + 1}/5] @${user.username} THẤT BẠI: ${result.error || JSON.stringify(result)}`);
        }
      } catch (err) {
        addLog(`❌ [${i + 1}/5] Lỗi kết nối mạng: ${err.message}`);
      }

      // Nghỉ 1.5 giây giữa mỗi lần bắn để tránh nghẽn request
      await new Promise(r => setTimeout(r, 1500));
    }

    addLog("🎉 HOÀN TẤT TOÀN BỘ BATCH 5 UID!");
  };
</script>
</body>
</html>
